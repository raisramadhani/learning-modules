            "hewan-udara": { name: "🦅 Hewan Udara", color: "sky" },

            "sayur": { name: "🥕 Sayur", color: "yellow" },
            "sekolah": { name: "📚 Alat Sekolah", color: "purple" },
            "rumah": { name: "🏠 Alat Rumah", color: "pink" }
        };

        // Display statistics
        const totalCategories = Object.keys(questionsByCategory).length;
        let totalQuestions = 0;
        Object.values(questionsByCategory).forEach(questions => {
            totalQuestions += questions.length;
        });

        document.getElementById('totalCategories').textContent = totalCategories;
        document.getElementById('totalQuestions').textContent = totalQuestions;

        // Display all questions by category
        const container = document.getElementById('questionsContainer');

        Object.keys(questionsByCategory).forEach(categoryKey => {
            const questions = questionsByCategory[categoryKey];
            const info = categoryInfo[categoryKey];

            // Create category section
            const categorySection = document.createElement('div');
            categorySection.className = 'bg-white rounded-lg shadow-lg p-6 mb-8';

            const categoryHeader = document.createElement('div');
            categoryHeader.className = `bg-${info.color}-100 border-l-4 border-${info.color}-500 p-4 mb-6 rounded`;
            categoryHeader.innerHTML = `
                <h2 class="text-2xl font-bold text-${info.color}-800">${info.name}</h2>
                <p class="text-${info.color}-600">Jumlah soal: ${questions.length}</p>
            `;
            categorySection.appendChild(categoryHeader);

            // Create grid for questions
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'border-2 border-gray-200 rounded-lg overflow-hidden hover:shadow-xl transition-shadow duration-300';
                card.innerHTML = `
                    <div class="relative">
                        <img src="${q.image}" alt="${q.word}" 
                             class="w-full h-48 object-cover"
                             onerror="this.parentElement.innerHTML='<div class=\\'w-full h-48 bg-red-100 flex items-center justify-center\\'><span class=\\'text-red-600 font-bold\\'>❌ Gambar Error</span></div>'">
                        <div class="absolute top-2 right-2 bg-white px-2 py-1 rounded shadow text-xs font-mono">
                            ID: ${q.id}
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="text-2xl font-bold text-center text-gray-800 mb-2">${q.word}</h3>
                        <p class="text-sm text-gray-600 text-center mb-2">Kategori: ${q.category}</p>
                        <div class="bg-gray-100 p-2 rounded">
                            <p class="text-xs text-gray-500 break-all">
                                <strong>URL:</strong><br>
                                <a href="${q.image}" target="_blank" class="text-blue-600 hover:underline">${q.image}</a>
                            </p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            categorySection.appendChild(grid);
            container.appendChild(categorySection);
        });
