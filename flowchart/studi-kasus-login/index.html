<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus Flowchart: Login System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* --- SHAPES --- */
        .shape-oval {
            border-radius: 999px;
        }

        /* Jajar Genjang (Output/Input) */
        .shape-parallelogram {
            transform: skewX(-20deg);
        }

        .shape-parallelogram>.shape-text {
            transform: skewX(20deg);
            font-style: normal !important;
            text-align: center;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Belah Ketupat (Decision Component) */
        .shape-diamond {
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .shape-diamond>.diamond-text {
            transform: rotate(-45deg);
            width: 140%;
            height: 140%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.65rem;
            line-height: 1.1;
            font-style: normal;
        }

        /* --- DRAG & DROP ITEMS --- */
        .draggable-item {
            cursor: grab;
            transition: transform 0.1s, box-shadow 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
        }

        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.02);
            z-index: 50;
        }

        /* --- DROP ZONES (Grid Putus-putus) --- */
        .drop-zone {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: scale(1.02);
        }

        .drop-zone.filled {
            border-color: transparent;
            background-color: transparent;
        }

        /* BARU: Class khusus untuk slot Decision agar border berbentuk belah ketupat */
        .drop-zone-diamond {
            transform: rotate(45deg);
        }

        /* Placeholder Text */
        .drop-zone .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 0.2s;
            width: 100%;
            text-align: center;
        }

        /* BARU: Counter-rotate untuk teks di dalam slot belah ketupat */
        .drop-zone-diamond .placeholder-text {
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 150%;
            /* Diperlebar agar teks muat horizontal */
        }

        .drop-zone.filled .placeholder-text {
            opacity: 0;
        }

        /* --- GRID --- */
        .grid-bg {
            background-color: #ffffff;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>

<body class="bg-slate-100 h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="bg-white shadow-sm z-30 px-6 py-3 border-b border-slate-200 shrink-0">
        <div class="max-w-[1200px] mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold text-slate-800 tracking-tight">Flowchart Builder</h1>
                <p class="text-xs text-slate-500">Studi Kasus: <span class="text-blue-600 font-semibold">Login System
                        Logic</span></p>
            </div>
            <div class="flex gap-3">
                <button onclick="resetGame()"
                    class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded shadow-sm transition active:scale-95">Reset</button>
                <button onclick="checkAnswers()"
                    class="px-5 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded shadow-md transition transform active:scale-95">Cek
                    Jawaban</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <div class="flex-1 overflow-auto bg-slate-100 relative flex justify-center p-8">
            <div class="relative w-[900px] h-[900px] bg-white shadow-xl rounded-xl border border-slate-200 grid-bg shrink-0 overflow-hidden"
                id="canvas-area">
                <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
                        </marker>
                    </defs>
                    <line x1="400" y1="80" x2="400" y2="120" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <line x1="400" y1="180" x2="400" y2="230" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <line x1="400" y1="330" x2="400" y2="390" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <line x1="400" y1="490" x2="400" y2="550" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <line x1="400" y1="610" x2="400" y2="730" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <path d="M 450 280 L 640 280" fill="none" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <text x="470" y="275" font-size="10" fill="#ef4444" font-weight="bold"
                        font-family="monospace">TIDAK</text>
                    <text x="405" y="360" font-size="10" fill="#22c55e" font-weight="bold"
                        font-family="monospace">YA</text>
                    <path d="M 450 440 L 640 440" fill="none" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                    <text x="470" y="435" font-size="10" fill="#ef4444" font-weight="bold"
                        font-family="monospace">TIDAK</text>
                    <text x="405" y="520" font-size="10" fill="#22c55e" font-weight="bold"
                        font-family="monospace">YA</text>
                    <polyline points="720 310 720 340 830 340 830 760 450 760" fill="none" stroke="#64748b"
                        stroke-width="2" />
                    <polyline points="720 470 720 500 830 500 830 760" fill="none" stroke="#64748b" stroke-width="2" />
                    <line x1="450" y1="760" x2="400" y2="760" stroke="#64748b" stroke-width="2"
                        marker-end="url(#arrow)" />
                </svg>

                <div class="absolute top-[30px] left-[336px]">
                    <div class="drop-zone shape-oval w-32 h-12" data-target="start">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">START</span>
                    </div>
                </div>
                <div class="absolute top-[120px] left-[320px]">
                    <div class="drop-zone shape-parallelogram w-40 h-14" data-target="input">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">Input Process</span>
                    </div>
                </div>
                <div class="absolute top-[230px] left-[350px]">
                    <div class="drop-zone drop-zone-diamond w-[100px] h-[100px]" data-target="dec_email">
                        <span class="placeholder-text text-[9px] font-mono text-slate-400">Decision</span>
                    </div>
                </div>
                <div class="absolute top-[250px] left-[640px]">
                    <div class="drop-zone shape-parallelogram w-40 h-14" data-target="out_notreg">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">Output</span>
                    </div>
                </div>
                <div class="absolute top-[390px] left-[350px]">
                    <div class="drop-zone drop-zone-diamond w-[100px] h-[100px]" data-target="dec_pass">
                        <span class="placeholder-text text-[9px] font-mono text-slate-400">Decision</span>
                    </div>
                </div>
                <div class="absolute top-[410px] left-[640px]">
                    <div class="drop-zone shape-parallelogram w-40 h-14" data-target="out_wrong">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">Output</span>
                    </div>
                </div>
                <div class="absolute top-[550px] left-[320px]">
                    <div class="drop-zone shape-parallelogram w-40 h-14" data-target="out_success">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">Output</span>
                    </div>
                </div>
                <div class="absolute top-[730px] left-[336px]">
                    <div class="drop-zone shape-oval w-32 h-12" data-target="stop">
                        <span class="placeholder-text text-[10px] font-mono text-slate-400">STOP</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-80 bg-white border-l border-slate-200 shadow-2xl flex flex-col z-40">
            <div class="p-5 bg-slate-50 border-b border-slate-200">
                <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-1">Komponen</h2>
                <p class="text-xs text-slate-500">Drag & Drop ke slot yang sesuai.</p>
            </div>
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50" id="toolbox"></div>
        </div>
    </main>

    <div id="success-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white rounded-2xl p-8 max-w-sm text-center shadow-2xl border border-slate-100">
            <div
                class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-800">Luar Biasa!</h3>
            <p class="text-slate-600 mt-2 mb-6">Logika alur login berhasil disusun dengan sempurna.</p>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')"
                class="w-full py-3 bg-slate-800 text-white font-semibold rounded-xl hover:bg-slate-900 transition shadow-lg">Tutup</button>
        </div>
    </div>

    <script>
        const items = [
            { id: 'start', text: 'START', shapeClass: 'shape-oval', bg: 'bg-slate-800', textCol: 'text-white' },
            { id: 'stop', text: 'STOP', shapeClass: 'shape-oval', bg: 'bg-slate-800', textCol: 'text-white' },
            { id: 'input', text: 'Input email & password', shapeClass: 'shape-parallelogram', bg: 'bg-blue-100', textCol: 'text-blue-900', border: 'border-blue-300' },
            { id: 'dec_email', text: 'Apakah email sudah terdaftar?', shapeClass: 'shape-diamond', bg: 'bg-amber-100', textCol: 'text-amber-900', border: 'border-amber-300' },
            { id: 'out_notreg', text: 'TAMPILKAN "Belum terdaftar"', shapeClass: 'shape-parallelogram', bg: 'bg-blue-100', textCol: 'text-blue-900', border: 'border-blue-300' },
            { id: 'dec_pass', text: 'Apakah email & password sesuai?', shapeClass: 'shape-diamond', bg: 'bg-amber-100', textCol: 'text-amber-900', border: 'border-amber-300' },
            { id: 'out_wrong', text: 'TAMPILKAN "Password salah"', shapeClass: 'shape-parallelogram', bg: 'bg-blue-100', textCol: 'text-blue-900', border: 'border-blue-300' },
            { id: 'out_success', text: 'TAMPILKAN "Berhasil Masuk"', shapeClass: 'shape-parallelogram', bg: 'bg-blue-100', textCol: 'text-blue-900', border: 'border-blue-300' }
        ];

        let draggedItem = null;
        let sourceZone = null;

        function init() { renderToolbox(); setupDragAndDrop(); }
        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function renderToolbox() {
            const toolbox = document.getElementById('toolbox'); toolbox.innerHTML = '';
            shuffle([...items]).forEach(item => {
                const el = document.createElement('div');
                el.className = `draggable-item relative z-20 font-semibold text-xs border ${item.border || 'border-transparent'}`;
                el.setAttribute('draggable', 'true'); el.setAttribute('data-id', item.id);
                let innerHTML = '';
                if (item.shapeClass.includes('diamond')) {
                    el.className += ` w-20 h-20 mx-auto mb-4 ${item.shapeClass} ${item.bg} ${item.textCol}`;
                    innerHTML = `<div class="diamond-text pointer-events-none">${item.text}</div>`;
                } else if (item.shapeClass.includes('parallelogram')) {
                    el.className += ` w-full max-w-[200px] h-12 mx-auto mb-3 ${item.shapeClass} ${item.bg} ${item.textCol}`;
                    innerHTML = `<div class="shape-text px-2 pointer-events-none not-italic">${item.text}</div>`;
                } else {
                    el.className += ` w-28 h-10 mx-auto mb-3 ${item.shapeClass} ${item.bg} ${item.textCol}`;
                    innerHTML = `<div class="pointer-events-none">${item.text}</div>`;
                }
                el.innerHTML = innerHTML; toolbox.appendChild(el);
            });
            setupItemEvents();
        }

        function setupItemEvents() {
            document.querySelectorAll('.draggable-item').forEach(el => {
                el.addEventListener('dragstart', e => {
                    draggedItem = el; sourceZone = el.parentNode;
                    e.dataTransfer.setData('text/plain', el.getAttribute('data-id'));
                    setTimeout(() => el.classList.add('opacity-50'), 0);
                });
                el.addEventListener('dragend', () => {
                    el.classList.remove('opacity-50'); draggedItem = null; sourceZone = null;
                });
            });
        }

        function updateZoneState(zone) {
            const hasItem = zone.querySelector('.draggable-item');
            hasItem ? zone.classList.add('filled') : zone.classList.remove('filled');
            zone.classList.remove('ring-2', 'ring-green-500', 'ring-red-500', 'bg-green-50', 'bg-red-50');
            if (hasItem) hasItem.classList.remove('ring-2', 'ring-green-500', 'ring-red-500');
        }

        function setupDragAndDrop() {
            const zones = document.querySelectorAll('.drop-zone');
            const toolbox = document.getElementById('toolbox');
            zones.forEach(zone => {
                zone.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (!zone.querySelector('.draggable-item')) zone.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
                zone.addEventListener('drop', e => {
                    e.preventDefault(); zone.classList.remove('drag-over');
                    if (draggedItem) {
                        const existing = zone.querySelector('.draggable-item');
                        if (existing) restoreToToolbox(existing);
                        zone.appendChild(draggedItem);

                        draggedItem.style.marginBottom = '0';
                        draggedItem.classList.remove('mb-3', 'mb-4', 'mx-auto', 'w-20', 'h-20', 'w-28', 'h-10', 'max-w-[200px]');

                        // LOGIKA KHUSUS BELAH KETUPAT
                        if (draggedItem.classList.contains('shape-diamond')) {
                            // Cegah rotasi ganda jika wadahnya juga diputar
                            if (zone.classList.contains('drop-zone-diamond')) {
                                draggedItem.style.transform = 'rotate(0deg)';
                            }
                            draggedItem.style.width = '72px'; draggedItem.style.height = '72px';
                            draggedItem.classList.remove('w-full', 'h-full');
                        } else {
                            draggedItem.classList.add('w-full', 'h-full');
                            draggedItem.style.width = ''; draggedItem.style.height = '';
                        }

                        updateZoneState(zone);
                        if (sourceZone && sourceZone.classList.contains('drop-zone')) updateZoneState(sourceZone);
                    }
                });
            });
            toolbox.addEventListener('dragover', e => e.preventDefault());
            toolbox.addEventListener('drop', e => {
                e.preventDefault();
                if (draggedItem && !toolbox.contains(draggedItem)) {
                    restoreToToolbox(draggedItem);
                    if (sourceZone && sourceZone.classList.contains('drop-zone')) updateZoneState(sourceZone);
                }
            });
        }

        function restoreToToolbox(item) {
            const toolbox = document.getElementById('toolbox'); const parent = item.parentNode;
            item.classList.remove('w-full', 'h-full'); item.style.marginBottom = '';
            item.style.width = ''; item.style.height = ''; item.style.transform = ''; // Reset transform

            if (item.classList.contains('shape-diamond')) {
                item.classList.add('w-20', 'h-20', 'mx-auto', 'mb-4');
            } else if (item.classList.contains('shape-parallelogram')) {
                item.classList.add('w-full', 'max-w-[200px]', 'h-12', 'mx-auto', 'mb-3');
            } else {
                item.classList.add('w-28', 'h-10', 'mx-auto', 'mb-3');
            }
            toolbox.appendChild(item);
            if (parent && parent.classList.contains('drop-zone')) updateZoneState(parent);
        }

        function checkAnswers() {
            const zones = document.querySelectorAll('.drop-zone');
            let correctCount = 0; let totalZones = items.length;
            zones.forEach(zone => {
                const item = zone.querySelector('.draggable-item');
                if (item && item.getAttribute('data-id') === zone.getAttribute('data-target')) {
                    correctCount++;
                    zone.classList.add('ring-2', 'ring-green-500', 'bg-green-50');
                    item.classList.add('ring-2', 'ring-green-500');
                } else {
                    zone.classList.add('ring-2', 'ring-red-500', 'bg-red-50');
                    if (item) item.classList.add('ring-2', 'ring-red-500');
                }
            });
            if (correctCount === totalZones) document.getElementById('success-modal').classList.remove('hidden');
        }

        function resetGame() {
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                const item = zone.querySelector('.draggable-item');
                if (item) item.remove();
                updateZoneState(zone);
            });
            renderToolbox(); document.getElementById('success-modal').classList.add('hidden');
        }

        init();
    </script>
</body>

</html>
